 40 mg do extrato de T. pratense, apresentaram redução de 56% na frequência do fogacho durante um período de 2 meses. A gravidade dos fogachos diminuiu em 43% e a gravidade da sudorese noturna diminuiu em 52%. Não foram observadas alterações na espessura endometrial e efeitos adversos. Os hemogramas completos estavam todos nos limites de normalidade.(32)","Clínicos — toxicológicos":"Nos ensaios clínicos controlados não foram observados efeitos tóxico-colaterais com o emprego de doses até 160 mg de isoflavonas por dia. Ressalta-se que Trifolium pratense não contém cumarinas, portanto, os relatos em relação à coagulação sanguínea não estão relacionados a essa espécie vegetal.(39,40)"},{"Não clínicos — farmacológicos":"Ensaios com extratos de U. tomentosa possibilitaram demostrar a atividade anti-inflamatória.(6,18) O extrato de U. tomentosa produziu efeito protetor em eritrócitos humanos submetidos a estresse oxidativo.(19)","Não clínicos — toxicológicos":"Extratos de U. tomentosa não causaram efeitos adversos em eritrócitos humanos.(19) Em estudo realizado com o extrato aquoso da casca do caule de U. tomentosa em ratos concluiu-se que não houve toxicidade aguda, mesmo com o uso de doses elevadas (> 8 g/kg).(12)","Clínicos — farmacológicos":"Ensaios clínicos com dois grupos utilizando o extrato aquoso de U. tomentosa na forma de cápsulas, contendo 20 mg de extrato, com teor de 14,7 mg/g de alcaloides oxindólicos pentacíclicos, livre de alcaloides oxindólicos tetracíclicos para a artrite reumatoide, na fase 1 os pacientes tratados com U. tomentosa apresentaram menos dores articulares em relação ao tratado com placebo (redução de 53,2% versus 24,1%). Além disso, evidenciou-se redução da fragilidade articular, índice Ritchie e duração de rigidez matinal no grupo tratado com U. tomentosa. Na fase 2, nos pacientes que receberam o extrato de U. tomentosa se observou redução da dor e edema articular, do índice Ritchie em relação aos tratados com o placebo. No grupo em que o extrato de U. tomentosa foi utilizado continuadamente, se evidenciou redução da fragilidade articular, índice Ritchie e duração de rigidez matinal, comparando-se a semana inicial de intervenção. No estudo demonstrou-se que o extrato aquoso de U. tomentosa livre de alcaloides oxindólicos tetracíclicos, em combinação com a sulfassalazina ou hidroxicloroquina, provocou efeitos clínicos favoráveis na artrite reumatoide.(20)","Clínicos — toxicológicos":"O extrato aquoso das cascas de U. tomentosa, foi administrado em voluntários na dose de 0,350 g/ kg pelo período de seis semanas consecutivas, sendo que não houve alterações hematológicas, peso corporal, diarreia, constipação, náuseas, cefaleia, edema e dor, sendo observados apenas aumento de glóbulos brancos.(12) No estudo utilizou-se o extrato aquoso de U. tomentosa na dose de 0,350 g/kg (2 vezes/dia), administrado em humanos durante dois meses. Foi observada melhora da imunidade dos pacientes (elevação de linfócitos e neutrófilos). Durante o experimento não houve sinais clínicos e laboratoriais de toxicidade.(14) Uncaria tomentosa (Willd. DC.) 105"},{"Não clínicos — farmacológicos":"Em experimentos em animais, foram observadas: Ação depressora central, sedativa, ansiolítica, espasmolítica e relaxante muscular. Os ácidos valerênicos in vitro diminuíram a degradação do ácido gama aminobutírico (GABA). Em experimentos em animais houve aumento do GABA na fenda sináptica via inibição da recaptação e aumento da secreção do neurotransmissor, podendo ser esse um dos efeitos que causam a atividade sedativa. Outro mecanismo que pode contribuir para essa atividade é a presença de altos níveis de glutamina no extrato, que tem a capacidade de cruzar a barreira hematoencefálica, sendo captada pelo terminal nervoso e convertida em GABA.(16,17)","Não clínicos — toxicológicos":"Extratos etanólicos de raizes de Valeriana officinalis causaram baixa toxicidade em roedores durante os testes agudos e de toxicidade de dose repetida ao longo do período de 4-8 semanas.(18)","Clínicos — farmacológicos":"Em estudo randomizado, controlado por placebo, os pacientes receberam 600 mg de extrato da raiz de V. officinalis padronizado em 0,4 a 0,6% de ácido valerênico (n = 61) ou placebo (n = 60) uma hora antes de dormir por 28 noites consecutivas. Dos pacientes que utilizaram a V. officinalis 66% apresentaram efeito terapêutico bom ou muito bom ao final do tratamento, comparado a 29% igualmente positivos do placebo.(3)","Clínicos — toxicológicos":"Vários estudos com extratos de valeriana foram realizados para avaliar a possível influência sobre a vigília. De acordo com esses estudos, altas doses do extrato da raiz de valeriana podem causar sedação leve depois das primeiras horas da administração, mas, diferentemente dos benzodiazepínicos, não reduz a vigília no dia seguinte.(18) Não foram encontrados dados descritos na literatura de resultados hematológicos ou bioquímicos."},{"Não clínicos — farmacológicos":"A administração intraduodenal de um extrato acetônico (rico em óleo essencial) do rizoma de gengibre em ratos aumentou a secreção biliar durante 3 horas após a administração.(20) A administração oral do extrato acetônico de gengibre (75 mg/kg), do [6]–shogaol; (2,5 mg/kg), do [6]-[8], ou do [10]-gingerol estimulou a motilidade gastrointestinal em ratos,(21) e a atividade foi comparável a de metoclopramida (10 mg/kg) e a domperidona.(21) O [6]-[8]-, ou [10]–gingerois são designados como antiserotoninérgicos, e relatos indicam que os efeitos do gengibre sobre a motilidade gastrointestinal podem ser devidos a esta atividade.(21,22) A via de administração parece desempenhar um papel importante nos estudos sobre a motilidade gastrintestinal. Por exemplo, tanto o [10]-gingerol quanto o [6]-shogaol inibiram a motilidade intestinal quando administrados por via intravenosa, mas a motilidade gastrointestinal foi acentuada após administração oral.(17,23,24) A ação emética do sulfato de cobre, agente de ação periférica, foi inibida em cães tratados com uma dose intra-gástrica de extrato de gengibre,(25) mas a emese em pombos tratados com eméticos de ação central, tais como a apomorfina e Digitalis não foi inibida pelo extrato de gengibre.(26) Esses resultados sugerem que a atividade antiemética do gengibre é periférica e não envolve o sistema nervoso central. (27) A ação antiemética do gengibre tem sido atribuída à ação combinada de zingeronas e shogaóis.(27) Em estudos in vitro verificou-se que um infuso de gengibre inibiu as atividades da ciclo-oxigenase e lipoxigenase, assim os seus efeitos anti-inflamatórios podem ser devidos à diminuição da formação de prostaglandinas e leucotrienos.(28) Verificou-se que o infuso de gengibre é um inibidor potente da tromboxano sintetase, e aumentou os níveis de prostaciclina, sem aumento concomitante de prostaglandinas E2 ou F2a.(29) Em estudos in vivo verificou-se que a administração oral de extratos de gengibre atuam na redução do edema da pata de rato e sua potência foi comparável a do ácido acetilsalicílico.(30,31) O [6]-shogaol inibiu o edema de pata induzido por carragenina em ratos por inibição da atividade da ciclo-oxigenase.(32) Os dialdeídos diterpenos do tipo labdano isolados a partir de extratos de gengibre têm sido descritos como inibidores da 5-lipoxigenase humana in vitro.(33)","Não clínicos — toxicológicos":"O infuso de gengibre causou atividade mutagênica em células B291I e Salmonella typhimurium cepa TA 100, mas não na cepa TA 98.(34) Entretanto, alguns componentes do gengibre fresco foram identificados como agentes mutagênicos. A ação mutagênica de [6]-gingerol e shogaóis foi determinada em ensaio com Salmonella/ microssoma,(35) e o aumento da mutagênese foi observado em uma cepa de Escherichia coli HS30 tratada com [6]-gingerol. (36) No entanto, a mutagenicidade de [6]-gingerol e shogaóis foi suprimida na presença de várias concentrações de um constituinte antimutagênico, zingerona, do gengibre.(35) Por outro lado, o sumo de gengibre demonstrou ser antimutagênico e suprimiu as mutações espontâneas induzidos por [6]-gingerol, exceto nos casos de adição dos produtos químicos mutagênicos 2-(2-furil)-3-(5nitro-2-furil) acrilamida e N-metil-N’-nitro-Nnitrosoguanidina ao [6]-gingerol.(37) Outros estudos também relataram a ação antimutagênica do suco de gengibre.(37,38)","Clínicos — farmacológicos":"Estudo clínico com a administração oral do pó do rizoma de gengibre (940 mg) foi mais eficaz do que dimenidrinato (100 mg) na prevenção dos sintomas gastrointestinais da cinetose.(39) Os resultados desse estudo sugeriram que o gengibre não age no centro do vômito em nível central, mas age diretamente sobre o trato gastrointestinal por meio de suas propriedades aromáticas, carminativas e absorventes, através do aumento da motilidade gástrica e absorção de toxinas e ácidos.(39) Em estudos clínicos randomizados, duplo-cego, o efeito do pó do rizoma de gengibre foi testado no tratamento profilático de náusea que, quando administrado por via oral foi estatisticamente melhor do que o placebo na redução da incidência de vômitos e sudorese 4 horas após a ingestão.(40,41) Na comparação dos efeitos de sete formulações de gengibre e antieméticos prescritos para a prevenção de enjôo em 1.489 indivíduos, o gengibre foi tão eficaz quanto os outros fármacos antieméticos testados.(40) Vários estudos clínicos avaliaram os efeitos da raiz de gengibre em casos de cinetose. Quatro dessas investigações possibilitaram verificar que o rizoma do gengibre administrado por via oral foi eficaz para a terapia profilática de náuseas e vômitos. Os estudos clínicos que avaliaram as reações gastrointestinais envolvidas na doença de movimento registraram melhores respostas do que aqueles que enfatizaram as respostas que envolvem o sistema nervoso central.(42-44) A hipótese de que o aumento do esvaziamento gástrico pode estar envolvido nos efeitos anti-eméticos de gengibre foi comprovada. Estudos clínicos concluíram que as doses orais de gengibre não atuam sobre o esvaziamento gástrico, tal como foi registrado por cintilografia sequencial gástrica e técnica de absorção de paracetamol.(45-46) Em um estudo duplo-cego, cruzado e randomizado, a administração oral de pó de rizoma de gengibre (250 mg, 4 vezes ao dia) foi efetiva no tratamento de casos de vômito pernicioso na gravidez. (47) Tanto o grau de náusea quanto o número de ataques de vómitos foram significativamente reduzidos.(47) Além disso, em um estudo prospectivo, randomizado, duplo-cego, com 60 pacientes que receberam gengibre, somente nos casos de náuseas e vômitos de pós-operatórios, foi detectada diferença significativa em comparação com o placebo,(48) sendo que o efeito do gengibre foi considerado tão eficaz ou melhor do que a metoclopramida.(48,49) A administração oral de pó de rizoma de gengibre em pacientes com distúrbios reumáticos e músculoesqueléticos produziu diferentes graus de alívio da dor e do edema.(50)","Clínicos — toxicológicos":"Nenhum efeito teratogênico foi observado em bebês cujas mães usaram Z. officinale para o alivio da hiperêmese gravídica.(27) Em estudo clínico duplo-cego, randomizado, foi evidenciada a ação efetiva do gengibre (250 mg por via oral, 4 vezes ao dia) no tratamento de vômito pernicioso na gravidez.(47) Efeitos teratogênicos não foram observados em crianças nascidas durante esse estudo, e todos os recém-nascidos apresentaram APGAR de 9 ou 10 após 5 minutos.(47)"}];
const plants=[{"scientific":"Actaea racemosa L.","name":"Cimicífuga","id":0,"page":18,"fields":{"Família":"Ranunculaceae.(1) Sinonímia: Cimicifuga racemosa (L.) Nutt.","Nomenclatura popular":"Cimicifuga.(2)","Parte utilizada/órgão vegetal":"Raiz ou rizoma.(2)","INDICAÇÕES TERAPÊUTICAS":"Alívio dos sintomas do climatério, como rubor, fogachos, transpiração excessiva, palpitações, alterações do humor, ansiedade e depressão.(2)","CONTRAINDICAÇÕES":"Contraindicado para pacientes com histórico de hipersensibilidade a qualquer um dos componentes do fitoterápico. Pacientes portadoras de insuficiência hepática.(3) Esse fitoterápico é contraindicado durante a gravidez.(11,15)","PRECAUÇÕES DE USO":"Pacientes devem ser alertadas quanto ao aparecimento e sintomas sugestivos de insuficiência hepática, tais como astenia, inapetência, icterícia cutânea ou de escleróticas, epigastralgia severa acompanhada de náusea e vômito ou urina com coloração escura.(15) Nesses casos, deve-se suspender o uso. É necessária precaução em pacientes alérgicos à aspirina ou outros salicilatos.(15) Em associação à terapia de reposição hormonal, deve manter-se avaliação médica a cada seis meses.(4,15)","EFEITOS ADVERSOS":"Pode causar desconforto gastrointestinal, erupção cutânea,(12,13) cefaleia e tontura.(4,15)","INTERAÇÕES MEDICAMENTOSAS":"Pode ocorrer antagonização do efeito imunossupressor promovido pela ciclosporina e azatioprina, ou seja, uma imunoestimulação podendo levar à rejeição em pacientes transplantadas que fazem uso desse fitoterápico.(5) Pode ocorrer interação com a atorvastatina.(15) Deve ser utilizada com cautela se associado a outros agentes hipotensores, como betabloqueadores (metoprolol ou propanolol) e bloqueadores dos canais de cálcio (diltiazem ou verapamil).(6,15) Pode ocorrer interação com analgésicos e anestésicos e efeitos aditivos com agentes gastrointestinais.(15)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo a droga vegetal, extrato seco etanólico ou isopropílico.(9) Armazenar ao abrigo da luz em local fechado.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 6 mg extrato seco (extrato etanólico).(10) 40-200 mg de rizomas secos de cimicifuga diariamente divididos em doses ou 0,4-2 mL da tintura (1:10) em etanol a 60%, diariamente. A raiz em pó ou o chá 1-2 g, três vezes por dia.(15)","TEMPO DE UTILIZAÇÃO":"Não deve ser utilizada por mais de 6 meses.(14) O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhado pelo profissional prescritor.","SUPERDOSAGEM":"Pode causar vertigem, cefaleia, náusea, vômito, hipotensão arterial, distúrbios visuais e circulatórios.(7)","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Aesculus hippocastanum L.","name":"Castanha-da-índia","id":1,"page":21,"fields":{"Família":"Sapindaceae.(1)","Nomenclatura popular":"Castanha-da-índia.(2)","Parte utilizada/órgão vegetal":"Semente.(2)","INDICAÇÕES TERAPÊUTICAS":"Para o tratamento da insuficiência venosa e fragilidade capilar.(3,4,5)","CONTRAINDICAÇÕES":"Pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico não devem fazer uso do produto. Esse fitoterápico é contraindicado para pessoas com hipersensibilidade a escina ou a extratos de A. hippocastanum e pacientes com insuficiência renal ou hepática.(6) Há indícios de que a absorção de escina seja maior em crianças, predispondo-as a maior toxicidade.(7)","PRECAUÇÕES DE USO":"Toxicidade renal e hepática foram relatadas com o uso de preparados a base de A. hippocastanum em pacientes propensos a esse tipo de distúrbios.(6) Embora não existam restrições, pacientes idosos só devem utilizar o fitoterápico com orientação médica. De acordo com a categoria de risco de fármacos destinados às mulheres grávidas, esse fitoterápico está incluído na categoria de risco C: não foram realizados estudos em animais e em mulheres grávidas; ou então, os estudos em animais revelaram risco, mas não existem estudos disponíveis realizados em mulheres grávidas. Esse fitoterápico não deve ser utilizado por mulheres grávidas sem orientação médica, assim como por crianças e adolescentes.(18)","EFEITOS ADVERSOS":"Após ingestão do fitoterápico podem ocorrer, em casos isolados, prurido, náuseas e desconforto gátrico.(8,9) Raramente podem ocorrer irritação da mucosa gástrica e refluxo.(7)","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico não deve ser administrado com anticoagulantes orais, pois pode potencializar seu efeito anticoagulante.(7) Cerca de 90% de escina ligamse às proteínas plasmáticas, podendo interferir com a distribuição de outras drogas.(6,7) Um caso de insuficiência renal foi relatado após administração concomitante de escina e o antibiótico gentamicina.(10)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato etanólico seco padronizado e gel.(3) Armazenar ao abrigo da luz e de umidade.(3)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 250 a 312 mg (dividida em duas vezes ao dia) do extrato padronizado contendo 16 a 20% de glicosídeos triterpênicos (equivalente a 100 mg de escina).(3) Tópico. Gel para uso tópico contendo 2% de escina.(3)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhado pelo profissional prescritor.","SUPERDOSAGEM":"Se ingerido em altas doses esse fitoterápico pode causar vômitos, diarreia, fraqueza, espasmos musculares, dilatação da pupila, falta de coordenação e distúrbios da visão e da consciência.(11) Assim como todos os extratos vegetais ricos em saponinas, podem ocorrer irritação da mucosa gástrica e refluxo. Quando grande quantidade de escina é absorvida através da mucosa gastrointestinal irritada ou lesionada, pode ocorrer hemólise, associada a dano renal.(12,13) Em caso de superdosagem, suspender o fitoterápico imediatamente. Recomenda-se tratamento de suporte sintomático com medidas habituais de apoio e controle das funções vitais. Aesculus hippocastanum L.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Allium sativum L.","name":"Alho","id":2,"page":24,"fields":{"Família":"Amaryllidaceae.(1)","Nomenclatura popular":"Alho.(2,3)","Parte utilizada/órgão vegetal":"Bulbos frescos ou secos.(3,4)","INDICAÇÕES TERAPÊUTICAS":"Indicado como coadjuvante no tratamento de bronquite crônica, asma, como expectorante,(5) e como preventivo de alterações vasculares.(5,6) Coadjuvante no tratamento de hiperlipidemia, hipertensão arterial leve a moderada, dos sintomas de gripes e resfriados e auxiliar na prevenção da aterosclerose. (3,4,5,7,8)","CONTRAINDICAÇÕES":"Contraindicado para grávidas, pacientes com gastrite, úlcera gastroduodenal, hipertireoidismo, distúrbios da coagulação ou em tratamento com anticoagulantes,(9,10) histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(4) Não deve ser usado em pré ou pós-operatórios, devendo ser suspenso pelo menos 10 dias antes de procedimentos cirúrgicos.(9,10)","PRECAUÇÕES DE USO":"Não usar em casos de hemorragia e tratamento com anticoagulantes e anti-hipertensivos.(4) Suspender o uso do fitoterápico duas semanas antes de intervenções cirúrgicas. Não usar em pessoas com gastrite, úlcera gastroduodenal, hipotensão arterial e hipoglicemia. Pode potencializar os efeitos antitrombóticos de fármacos anti-inflamatórios.(5)","EFEITOS ADVERSOS":"Esse fitoterápico pode causar ardência na cavidade oral e no trato gastrointestinal,(5) mialgia, fadiga, vertigem,(11) sudorese, bem como reações alérgicas e asma.(12) O uso desse fitoterápico pode causar decréscimo do hematócrito e da viscosidade sanguínea, aumentando o risco de sangramento pós-operatório,(13) bem como hematoma epidural espontâneo.(14) Efeitos gastrointestinais, tais como desconforto abdominal, náuseas, vômitos e diarreia também são possíveis. Odores corporais característicos de alho podem ocorrer com o uso desse fitoterápico.(15)","INTERAÇÕES MEDICAMENTOSAS":"Foi descrita interação potencial entre Allium sativum e varfarina.(4,5) Esse fitoterápico não pode ser utilizado em associação com anticoagulantes orais, heparina, agentes trombolíticos, antiagregantes plaquetários e anti-inflamatórios não-esteroidais, por aumentarem o risco de hemorragias.(16) A associação desse fitoterápico com inibidores da protease pode reduzir as concentrações séricas dessa classe, aumentando o risco de resistência ao antiretroviral e falhas no tratamento.(17,18) Além disso, pode diminuir a efetividade da clorzoxazona por induzir o seu metabolismo.(19,20)","FORMAS FARMACÊUTICAS":"Tintura, alcoolatura, extrato fluido e cápsulas com o óleo.(3,4,32)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Tintura (1:5 em álcool 45%): acima de 12 anos tomar 50 a 100 gotas (2,5 a 5 mL) da tintura diluídas em 75 mL de água, duas a três vezes ao dia. (3) Óleo: 2-5 mg (dose diária).(4) Pó seco: 0,4-1,2 g (dose diária).(4) Alcoolatura e extrato fluido: 1 a 2 mL diluídos em 75 ml de água duas vezes ao dia.(32,33)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica. Allium sativum L."}},{"scientific":"Aloe vera (L.) Burm.f.","name":"Babosa","id":3,"page":28,"fields":{"Família":"Xanthorrhoeaceae.(1)","Nomenclatura popular":"Babosa, aloe.(2,3,4)","Parte utilizada/órgão vegetal":"Gel incolor mucilaginoso de folhas frescas.(4)","INDICAÇÕES TERAPÊUTICAS":"Queimaduras de primeiro e segundo graus, e como cicatrizante.(5,6)","CONTRAINDICAÇÕES":"É contraindicado em pacientes com hipersensibilidade aos componentes do fitoterápico e, em casos de alergia conhecida às plantas da família Xanthrrorhoeacea.(5)","PRECAUÇÕES DE USO":"Orientar a não utilização do produto se apresentar alteração da coloração.(5)","EFEITOS ADVERSOS":"Foram relatados alguns casos de dermatite de contato que podem estar associados à presença de constituintes antracênicos, comumente encontrados na parte externa da folha que não deve ser utilizada nas preparações farmacêuticas.(5)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Gel hidrofílico e pomada.(5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Tópica. Aplicar na área afetada uma a três vezes ao dia.(6)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Calendula officinalis L.","name":"Calêndula","id":4,"page":30,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Calêndula.(2)","Parte utilizada/órgão vegetal":"Flores.(3)","INDICAÇÕES TERAPÊUTICAS":"Uso externo como anti-inflamatório, cicatrizante e antisséptico.(4) Para o tratamento de lesões da pele e mucosas, promovendo a cicatrização e modulando os possíveis focos inflamatórios.(5,6)","CONTRAINDICAÇÕES":"Contraindicado a pacientes com histórico de hipersensibilidade ou alergia aos componentes do fitoterápico ou a outras plantas da família Asteraceae. (7) Não deve ser administrado durante a gravidez, lactação ou para crianças sem supervisão médica.(8)","PRECAUÇÕES DE USO":"Não foram encontrados dados descritos na literatura consultada.","EFEITOS ADVERSOS":"Reações alérgicas e sensibilização da pele foram relatadas. Efeitos espermicida, antifertilizante e uterotônico também foram relatados.(7)","INTERAÇÕES MEDICAMENTOSAS":"Não foram encontrados dados descritos na literatura consultada.","FORMAS FARMACÊUTICAS":"Infusão: 1 a 2 g em 150 mL de água.(4) Tintura: 1:10 em álcool 70% ou 1:5 em álcool 90% .(4,8,9) Extrato fluido: 1:1 em álcool 40%.(9) Gel: com extrato glicólico a 10%.(8) Creme: com extrato glicólico a 10%.(8) Pomada (base de lanovaselina) a 10% com extrato hidroalcoolico (tintura 1:5).(34)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Tópica Infusão: aplicar três vezes ao dia com auxílio de algodão ou sob a forma de bochechos ou gargarejos.(28) Tintura: realizar bochechos ou gargarejos com 25 mL de tintura diluída em 100 mL de água.(28) Gel: aplicar na área afetada três vezes ao dia a formulação contendo 10% da tintura.(28) Creme ou pomada: aplicar na área afetada três vezes ao dia nos casos de eczemas ou uma vez ao dia nos casos de feridas a formulação contendo 10% do extrato glicólico.(28, 34)","TEMPO DE UTILIZAÇÃO":"O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem para o uso externo. Em caso de administração de quantidades acima das recomendadas ou por outra via, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Cynara scolymus L.","name":"Alcachofra","id":5,"page":35,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Alcachofra.(2)","Parte utilizada/órgão vegetal":"Folhas.(2)","INDICAÇÕES TERAPÊUTICAS":"Antidispéptico, antiflatulento, diurético. Auxiliar na prevenção da aterosclerose. Coadjuvante no tratamento de dislipidemia mista leve a moderada e como auxiliar nos sintomas da síndrome do intestino irritável.(3,4,16,17,18,19,20)","CONTRAINDICAÇÕES":"Contraindicado para pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico ou a outras plantas da família Asteraceae.(4) Também é contraindicado em casos de obstrução do ducto biliar, gravidez e lactação.(4,5,6)","PRECAUÇÕES DE USO":"O uso concomitante com diuréticos em casos de hipertensão arterial ou cardiopatia deve ser realizado sob estrita supervisão médica, dada à possibilidade de haver descompensação da pressão arterial, ou, se a eliminação de potássio for considerável, pode ocorrer potencialização de fármacos cardiotônicos.(4) A ocorrência de hipersensibilidade para C. scolymus foi relatada, devido à presença de lactonas sesquiterpênicas como a cinaropicrina.(4) Não existem estudos disponíveis para recomendar o uso em menores de 12 anos ou durante a gravidez.(4) Não deve ser utilizado por mulheres grávidas sem orientação médica.(4)","EFEITOS ADVERSOS":"Efeito laxante em pessoas sensíveis aos componentes do fitoterápico.(5)","INTERAÇÕES MEDICAMENTOSAS":"Redução da eficácia de medicamentos que interferem na coagulação sanguínea, como ácido acetilsalicílico e anticoagulantes cumarínicos (ex. varfarina).(4) Potenciais interações: pode diminuir as concentrações sanguíneas de fármacos de medicamentos metabolizados pelas CYP3A4, CYP2B6 e CYP2D6, uma vez que a C. scolymus é indutora dessas enzimas.","FORMAS FARMACÊUTICAS":"Droga vegetal encapsulada, comprimido (droga vegetal), infusão, e extrato seco padronizado.(3,5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 1-2 g de extrato seco aquoso.(3,7,8,9) Tomar duas cápsulas, de duas a quatro vezes ao dia.(5)","TEMPO DE UTILIZAÇÃO":"Se os sintomas persistirem por mais de 2 semanas durante o uso do fitoterápico, um médico deve ser consultado.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente sob observação.","PRESCRIÇÃO":"Fitoterápico isento de prescrição médica."}},{"scientific":"Echinacea purpurea (L.) Moench","name":"Equinácea","id":6,"page":38,"fields":{"Família":"Asteraceae.(1)","Nomenclatura popular":"Equinácea.(2)","Parte utilizada/órgão vegetal":"Raiz.(5)","INDICAÇÕES TERAPÊUTICAS":"Preventivo e coadjuvante no tratamento dos sintomas de resfriados.(5)","CONTRAINDICAÇÕES":"Devido à possível ativação de agressões auto-imunes e outras respostas imunes hiper-reativas, o fitoterápico não deve ser administrado em pacientes com esclerose múltipla, colagenose, Síndrome da Imunodeficiência Adquirida (SIDA), tuberculose, pacientes em uso de medicamentos imunossupressores e outras desordens auto-imunes.(3,4) Contraindicado para crianças, grávidas e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(5)","PRECAUÇÕES DE USO":"Esse fitoterápico não deve ser utilizado por grávidas e lactantes sem orientação médica.(3) Não deve ser utilizado em casos de doenças auto-imunes (encefalites difusa, eritema nodoso, trombocitopenia imunomediada, síndrome de Evans, síndrome de Sjögren com disfunção tubular renal), infecções por HIV e tuberculose. Leucopenia pode ocorrer pela utilização a longo prazo (mais de 8 semanas).(5)","EFEITOS ADVERSOS":"Pode causar febre e distúrbios gastrointestinais, como náusea, vômito e paladar desagradável logo após a ingestão. Raras reações alérgicas tais como prurido e agravamento de quadros asmáticos.(4) Reações de hipersensibilidade foram relatadas, como dermatite atópica, urticária, Síndrome de Stevens Johnson, angioedema da pele, edema Quincke e broncoespasmo.","INTERAÇÕES MEDICAMENTOSAS":"Deve ser administrado com cautela em associação com fármacos cujo metabolismo é dependente das enzimas CYP.(6)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato seco (etanólico).(3) Raiz seca pulverizada.(5)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral: extrato seco 250 mg, 1 a 3 vezes ao dia (equivalente a 10-30 mg de ácido chicórico por dia).(2) Extrato seco (5,5 - 7.5:1) 30 mg de extrato, equivalente a 200 mg de droga vegetal: 6-9 comprimidos por dia.(5) Raiz seca pulverizada, tomar duas cápsulas, três vezes ao dia.(4,5,13)","TEMPO DE UTILIZAÇÃO":"Não utilizar por mais que 8 semanas sucessivas.(3)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração acima das doses recomendadas, suspender o uso e manter o paciente sob observação.(5)","PRESCRIÇÃO":"Fitoterápico somente sob prescrição médica."}},{"scientific":"Equisetum arvense L.","name":"Cavalinha","id":7,"page":40,"fields":{"Família":"Equisetaceae.(1)","Nomenclatura popular":"Cavalinha.(2)","Parte utilizada/órgão vegetal":"Folhas e partes aéreas.(3)","INDICAÇÕES TERAPÊUTICAS":"Diurético.(4,5)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(6,7,8) Contraindicado para pacientes nos quais a ingestão reduzida de líquidos é recomendada (por exemplo, doenças cardíacas e renais severas).(8)","PRECAUÇÕES DE USO":"A ingestão crônica diminui níveis da vitamina B1 (tiamina) e o efeito diurético pode causar a perda de potássio (hipocalemia).(7) Em pacientes que apresentam insuficiência renal crônica e que fazem uso de medicamentos que alteram níveis de potássio, pode causar hipercalemia.(8) Se as queixas ou sintomas tais como febre, disúria, espasmo ou hematúria ocorrerem durante o uso do fitoterápico um médico deverá ser consultado.(8) Para outras preparações, exceto o chá medicinal (infuso), recomenda-se manter a ingestão de líquidos apropriada.(8)","EFEITOS ADVERSOS":"Bloqueio atrioventricular transitório, distúrbios gastrointestinais e reações alérgicas.(8)","INTERAÇÕES MEDICAMENTOSAS":"O uso de extratos de E. arvense pode inibir a enzima CYP1A2, interferindo possivelmente com fármacos metabolizados por essa via.(9)","FORMAS FARMACÊUTICAS":"Tintura: (1:4-5) em solução hidroetanólica a 31,5% (p/p); Tintura (1:5) em solução hidroetanólica a 96% (v/v); Cápsula e comprimido contendo extrato seco (4- 7:1) com extração aquosa; Cápsula e comprimido contendo extrato seco (7,5-10,5:1) com extração hidroetanólica a 70% (v/v);(8) Chá medicinal (infusão).(10,11)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral Adulto: a) infusão de folhas ou partes aéreas de 2-3 g em 250 mL de água fervente (xícara de chá), (8, 10, 12); b) droga vegetal rasurada: 570 mg; c) tintura:(1:4-5) em solução hidroetanólico a 31,5% (p/p): 20 gotas; d) tintura: (1:5) em solução hidroetanólico a 96% (v/v): 30 a 40 gotas; e) extrato seco (4-7:1) com extração aquosa: 185 mg; f) extrato seco (7,5-10,5:1) com extração hidroetanólica a 70% (v/v): 200 – 225 mg.(8) Dose diária: 3 doses; Dose diária máxima: 4 doses.(8)","TEMPO DE UTILIZAÇÃO":"Utilizar por duas a quatro semanas. Se os sintomas persistirem após uma semana do uso do fitoterápico um médico ou profissional da saúde qualificado deverá ser consultado.(8)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de administração de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica. Equisetum arvense L."}},{"scientific":"Ginkgo biloba L.","name":"Ginkgo","id":8,"page":43,"fields":{"Família":"Ginkgoaceae.(1)","Nomenclatura popular":"Ginkgo.(2)","Parte utilizada/órgão vegetal":"Folhas.(2)","INDICAÇÕES TERAPÊUTICAS":"Vertigem e zumbidos (tinitus) resultantes de distúrbios circulatórios, distúrbios circulatórios periféricos, como cãimbras.(2,3)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas e a lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico. Pacientes com coagulopatias ou em uso de anticoagulantes e antiagregantes plaquetários devem ser cuidadosamente monitorados.","PRECAUÇÕES DE USO":"O uso do G. biloba deve ser suspenso pelo menos três dias antes de procedimentos cirúrgicos.(3,4) Deve ser evitado em pacientes que apresentam crises convulsivas, principalmente se essas estiverem relacionadas com o uso de preparações com Ginkgo biloba.(5)","EFEITOS ADVERSOS":"Podem ocorrer distúrbios gastrointestinais, cefaleia e reações alérgicas cutâneas (hiperemia, edema e prurido).(4) Também foram relatados enjoos, palpitações, hemorragias e hipotensão.(6) Casos de hemorragia subaracnoidea, hematoma subdural, hemorragia intracerebral, hematoma subfrênico, hemorragia vítrea e sangramento pós-operatório foram relatados em pacientes que faziam uso de G. biloba isoladamente.(7,9)","INTERAÇÕES MEDICAMENTOSAS":"A associação desse medicamento com anticoagulantes, antiplaquetários, anti-inflamatórios não esteroidais (AINES) e/ou agentes trombolíticos pode aumentar o risco de hemorragias. Esse medicamento pode diminuir a efetividade dos anticonvulsivantes e pode alterar os efeitos da insulina, aumentando a sua depuração. Pode provocar mudanças no estado mental quando associado à buspirona ou ao Hypericum perforatum. Pode potencializar o efeito dos inibidores da monoaminaoxidase e pode aumentar o risco dos efeitos colaterais da nifedipina. Pode aumentar o risco de aparecimento da síndrome serotoninérgica quando associado aos inibidores da recaptação de serotonina e pode causar hipertensão arterial em uso concomitante com os diuréticos tiazídicos, segundo relato de caso.(7,8) A associação desse medicamento com omeprazol pode acarretar diminuição de nível sérico do omeprazol.(10) A associação com trazodona pode trazer risco de sedação excessiva.(11) O uso concomitante de G. biloba pode aumentar os riscos de eventos adversos causados pela risperidona, como, por exemplo, priapismo. (12) A associação com papaverina pode acarretar potencialização de efeitos terapêuticos e adversos.(13) Se o medicamento for administrado concomitantemente com anticoagulantes (ex. fenoprocoumon e varfarina) ou medicamentos antiplaquetários (por exemplo, clopidogrel, ácido acetilsalicílico e outros fármacos anti-inflamatórios não esteróides), o efeito pode ser influenciado.Os estudos disponíveis com varfarina não indicam que há uma interação entre varfarina e produtos de G. biloba, mas um acompanhamento adequado é aconselhável. Um estudo de interação com talinolol indicou que G. biloba pode inibir a P-glicoproteína intestinal. Isso pode dar origem a maior exposição dos fármacos marcadamente afetados pela P-glicoproteína no intestino, tais como etexilato de dabigatrano. Deve-se acompanhar a combinação de G. biloba e dabigatran. Não é recomendado o uso concomitante de preparações de G. biloba e efavirenz, pois há a diminuição plasmática por indução da atividade de CYP3A4.","FORMAS FARMACÊUTICAS":"Capsula e comprimido revestido contendo o extrato padronizado (extrato seco das folhas secas) contendo 22–27% de flavonoides glicosilados e 5–7% de lactonas terpênicas (constituídas por aproximadamente 2,8–3,4% de gingkolídeos A, B, e C, além de 2,6–3,2% de bilobalídeo). O teor de ácido ginkgólico é inferior a 5 mg/kg. Soluções para uso oral preparados com o extrato padronizado.(14) Ginkgo biloba L.","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato seco: 120–240 mg diariamente, divididos em 2 ou 3 doses (40 mg de extrato equivale a 1,4-2,7g de folhas).(14) Extrato fluido (1:1): 0,5 mL, 3 vezes ao dia.(14)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico somente sob prescrição médica."}},{"scientific":"Glycine max (L.) Merr.","name":"Soja","id":9,"page":47,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Soja.(2,3)","Parte utilizada/órgão vegetal":"Sementes.(2,4,5)","INDICAÇÕES TERAPÊUTICAS":"Esse fitoterápico é indicado como coadjuvante no alívio dos sintomas do climatério: sintomas vasomotores, tais como: ondas de calor e sudorese. É considerado modulador seletivo de receptores estrogênicos.(2,6)","CONTRAINDICAÇÕES":"Esse fitoterápico é contraindicado para menores de 12 anos. Pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico não devem fazer uso do mesmo.","PRECAUÇÕES DE USO":"Pode ocorrer reação alérgica cruzada com amendoim.(2) De acordo com a categoria de risco de fármacos destinados às mulheres grávidas, esse fitoterápico está incluído na categoria de risco C. Não há estudos disponíveis sobre a teratogenicidade de preparações com alta concentração de isoflavonas, bem como não há evidências científicas disponíveis sobre a segurança de seu uso durante a gestação e lactação, devendo seu emprego ser evitado nessas condições. Esse fitoterápico não deve ser utilizado por mulheres grávidas e em amamentação sem orientação médica.(2)","EFEITOS ADVERSOS":"O uso desse fitoterápico pode provocar distúrbios gastrointestinais leves como constipação, flatulência e náusea.(7) Nas doses diárias recomendadas, não foram relatadas reações adversas graves.(8)","INTERAÇÕES MEDICAMENTOSAS":"Evitar a associação desse fitoterápico com contraceptivos e outros medicamentos de ação estrogênica.(10) A efetividade do tamoxifeno pode ser diminuída por medicamentos à base de soja.(11) A proteína da soja pode reduzir a absorção de levotiroxina no trato digestivo, portanto não se deve tomar os dois medicamentos concomitantemente. É necessário aguardar 2 horas entre uma e outra tomada.(7) As isoflavonas genisteína e daidzeína podem bloquear a tireóide peroxidase e inibir a síntese de tiroxina. Pode ocorrer hipotireoidismo durante tratamentos prolongados.(12) O uso de medicamentos que alteram a microbiota intestinal, como os antibióticos, pode interferir no metabolismo das isoflavonas.(7)","FORMAS FARMACÊUTICAS":"Cápsulas contendo extrato de G. max: padronizado para conter no mínimo 400 mg em isoflavonas.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. A dose diária deve estar entre 50 e 120 mg de isoflavonas.(6)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo profissional prescritor.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição medica."}},{"scientific":"Harpagophytum procumbens DC. e Harpagophytum zeyheri Ihlenf. & H. Hartmann","name":"Garra-do-diabo","id":10,"page":51,"fields":{"Família":"Pedaliaceae.(1)","Nomenclatura popular":"Garra-do-diabo.(2)","Parte utilizada/órgão vegetal":"Raízes secundárias.(2)","INDICAÇÕES TERAPÊUTICAS":"Alívio de dores articulares moderadas e lombalgia aguda.(2)","CONTRAINDICAÇÕES":"A pacientes com cálculos biliares.(3) É contraindicado para menores de 18 anos
