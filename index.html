(2,3,6)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo a droga vegetal, e extratos padronizados em senosídeos.","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Uso adulto e infantil acima de 12 anos. Droga vegetal: 1 a 2g de folhas ou frutos, diariamente antes de dormir. 150 mg de extrato seco, de uma a três vezes ao dia, equivalente a 10-30 mg de senosídeos (calculados como senosídeo B), administrada à noite.(2)","TEMPO DE UTILIZAÇÃO":"Contraindicado por mais de duas semanas sem supervisão médica.(2)","SUPERDOSAGEM":"Os principais sintomas da superdosagem são dores abdominais,(5,6) espasmos, náusea, cólicas e diarreias severas, com consequente perda excessiva de fluidos e eletrólitos.(5) Deve-se manter tratamento de suporte, através da ingestão de grandes quantidades de líquidos. Os eletrólitos, especialmente o potássio, devem ser monitorados, particularmente em idosos e crianças. (2,5,6)","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Serenoa repens (W. Bartram) Small","name":"Saw palmetto","id":22,"page":94,"fields":{"Família":"Arecaceae.(1)","Nomenclatura popular":"Saw-palmetto.(2)","Parte utilizada/órgão vegetal":"Frutos.(2)","INDICAÇÕES TERAPÊUTICAS":"Tratamento sintomático da hiperplasia prostática benigna (HPB).(2)","CONTRAINDICAÇÕES":"Contraindicado para crianças, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer uma das substâncias ativas da espécie vegetal. Esse fitoterápico não é indicado para casos avançados de HPB com severa retenção urinária e afecções hepáticas.(3)","PRECAUÇÕES DE USO":"Não deverá ser utilizado sem primeiro afastar a possibilidade de câncer de próstata. Os pacientes devem passar por criteriosa avaliação médica antes de utilizar esse medicamento, a fim de excluir a possibilidade de nefrite, infecções do trato urinário e outras desordens nefro urológicas.(3) Os seguintes fatores devem ser levados em consideração antes do início do tratamento com Serenoa repens: idade > 70 anos, pico de fluxo urinário < 12 mL/s, volume da próstata de 30 cm3, volume residual > 50 mL e PSA sanguíneo de 1,4 ng/mL.(3)","EFEITOS ADVERSOS":"Esse fitoterápico pode causar náuseas, dor abdominal, distúrbios gástricos, constipação intestinal e diarreia. Em casos raros, hipertensão arterial, diminuição da libido, impotência sexual, cefaleia e retenção urinária, síndrome de íris flácida intraoperatória.(3)","INTERAÇÕES MEDICAMENTOSAS":"Hormônios utilizados na Terapia de Reposição Hormonal (TRH) podem exigir ajuste de dose, devido aos efeitos antiandrogênicos e antiestrogênicos desse fitoterápico. Em estudo in vitro verificou-se a potencialização da inibição dos antagonistas do 1-alfa-adrenoreceptor, porém a relevância clinica desse não foi confirmada.(4) Não utilizar esse medicamento com anticoagulantes como warfarina, clopidogrel e ácido acetilsalicílico.(3)","FORMAS FARMACÊUTICAS":"Cápsulas gelatinosas e comprimidos contendo a droga vegetal, ou extratos padronizados (70–95% ácidos graxos livres e ésteres etílicos correspondentes).(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Dose diária: 1–2 g da droga ou 320 mg (dose única ou 160 mg, duas vezes ao dia) do extrato lipidoesterólico padronizado para conter 70–95% ácidos graxos livres e ésteres etílicos correspondentes e formas farmacêuticas equivalentes.(2)","TEMPO DE UTILIZAÇÃO":"Não foram encontrados dados descritos na literatura consultada sobre o tempo máximo de utilização. O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo médico.","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado.","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição medica."}},{"scientific":"Stryphnodendron adstringens (Mart.) Coville","name":"Barbatimão","id":23,"page":97,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Barbatimão.(2)","Parte utilizada/órgão vegetal":"Cascas.(2)","INDICAÇÕES TERAPÊUTICAS":"Cicatrizante.(3)","CONTRAINDICAÇÕES":"Contraindicado em situações em que há necessidade da exsudação por meio de drenos ou de forma espontânea.(3)","PRECAUÇÕES DE USO":"As formas farmacêuticas de uso externo não deverão ser aplicadas em úlceras ou ferimentos que necessitem de alta vascularização.(3)","EFEITOS ADVERSOS":"Poderá ocorrer reação alérgica em pessoas com histórico de alergias a outras espécies vegetais.(3)","INTERAÇÕES MEDICAMENTOSAS":"Devido à presença de taninos como componente desse fitoterápico, evitar o uso concomitante com sais de prata, bases proteicas e princípios ativos vasodilatadores.(3)","FORMAS FARMACÊUTICAS":"Uso externo Creme: contendo 10% de extrato glicólico de S. adstringens.(3) Pomadas: contendo 5% do extrato glicólico de S. adstringens ou pomada contendo 3% de extrato seco.(14) ** As preparações devem conter 30 mg de fenóis totais e 27 mg de taninos totais.(3)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Uso externo Aplicar até três vezes ao dia na área afetada, após a higienização.(3)","TEMPO DE UTILIZAÇÃO":"O tempo de uso depende da indicação terapêutica e da evolução do quadro acompanhada pelo médico.","SUPERDOSAGEM":"Em caso de administração de quantidades acima das recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Trifolium pratense L.","name":"Trevo-vermelho","id":24,"page":100,"fields":{"Família":"Leguminosae.(1)","Nomenclatura popular":"Trevo-vermelho.(2,3)","Parte utilizada/órgão vegetal":"Inflorescências secas.(4)","INDICAÇÕES TERAPÊUTICAS":"Alívio dos sintomas da menopausa (principalmente fogachos), mastalgia e síndrome pré-menstrual.(5-11)","CONTRAINDICAÇÕES":"Produtos a base da inflorescência de Trifolium pratense são contraindicados em casos de hipersensibilidade ou alergia a droga vegetal ou a espécie in natura. Está também contraindicado durante a gravidez, na amamentação e para crianças menores de 12 anos, e em casos de doenças hormonais associadas, ao efeito potencial dos hormônios.(4)","PRECAUÇÕES DE USO":"Deverão ser observadas as condições que podem ser agravadas pelo aumento do nível de estrogênio, como a endometriose ou miomas uterinos.(11)","EFEITOS ADVERSOS":"A ingestão de grandes quantidades de T. pratense em alimentos por animais tem sido associada a um número de efeitos adversos em ovelhas na Austrália. A “doença do trevo” caracterizada por sintomas de infertilidade, lactação anormal, distocia e prolapso uterino, foram hipoteticamente atribuídos aos efeitos estrogênicos de isoflavonas.(12) Em nenhum dos ensaios clínicos controlados observou-se efeitos adversos com doses de até 0,160 g de isoflavonas por dia.(13,14)","INTERAÇÕES MEDICAMENTOSAS":"Alguns estudos possibilitam imaginar que as isoflavonas específicas podem aumentar a capacidade do tamoxifeno de inibir o crescimento de células de câncer de mama estrogênico-receptor positivo. (15-17) Em modelos de roedores, a genisteína tem inibido a eficácia do tamoxifeno sobre o crescimento de células de câncer de mama hormônio-receptor positivo em ratas ovariectomizadas, enquanto que em outros estudos verificaram que isoflavonas específicas podem produzir efeito aditivo e sinérgico na prevenção do desenvolvimento de tumores induzidos quimicamente e o crescimento de tumores existentes. Portanto, o uso da droga bruta ou suas preparações não é recomendado em pacientes que estão sendo tratadas com tamoxifeno e outros medicamentos anti-estrogênicos.(18-20) As isoflavonas presentes nos extratos de T. pratense são inibidoras das enzimas hepáticas CYP 1A1, CYP 1B1 e CYP 2CP o que pode levar ao aumento dos níveis séricos de alguns fármacos.(21) Podem interagir potencialmente com anticoagulantes (heparina e varfarina) e antiagregantes plaquetários (aspirina, clopidogrel e ticlopidina), por isso recomenda-se cautela na utilização de T. pratense em pacientes susceptíveis a sangramentos ou com distúrbios de coagulação.(21,22)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato bruto padronizado (0,5% de isoflavonas). Extrato bruto padronizado não menos que 0,5% de isoflavonas (daidzeína, genisteína, formononetina e biochanina A).(1)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato bruto: 240-480 mg correspondendo a 40-80 mg/dia de isoflavonas.(4)","TEMPO DE UTILIZAÇÃO":"Extrato padronizado de T. pratense pode ser utilizado com segurança em administração diária por 12 meses.(23)","SUPERDOSAGEM":"Não foram encontrados dados descritos na literatura consultada sobre problemas decorrentes de superdosagem. Em caso de ingestão de quantidades acima das recomendadas o paciente deve ser observado","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica. Trifolium pratense L."}},{"scientific":"Uncaria tomentosa (Willd. ex Roem. & Schult.) DC.","name":"Unha-de-gato","id":25,"page":104,"fields":{"Família":"Rubiaceae.(1)","Nomenclatura popular":"Unha-de-gato, espera-aí, junpindá.(2,3)","Parte utilizada/órgão vegetal":"Cascas.(4,5)","INDICAÇÕES TERAPÊUTICAS":"Anti-inflamatório.(6)","CONTRAINDICAÇÕES":"Contraindicado para grávidas e lactantes.(7)","PRECAUÇÕES DE USO":"Pacientes que serão submetidos a transplantes, devido ao seu efeito imunoestimulante, não devem fazer o uso desse fitoterápico.(8,9)","EFEITOS ADVERSOS":"Potencializa a ação de anticoagulantes, aumentando o risco de hemorragias.(9,10)","INTERAÇÕES MEDICAMENTOSAS":"Administrar em associação com medicamentos e drogas vegetais, como varfarina, estrógenos, teofilina e gengibre, metabolizados pela via do citocromo P-450, apenas com acompanhamento médico.(11)","FORMAS FARMACÊUTICAS":"Cápsulas e comprimidos contendo extrato seco. Decocto. Extrato fluido.(12,13)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Extrato fluido: de 2,5 a 5 mL, 1 a 2 vezes ao dia.(13) Comprimido contendo 350 mg de extrato seco, duas vezes ao dia.(14) Cápsula (droga vegetal): 300–500 mg, 1 cápsula, 2 a 3 vezes ao dia.(11) Extrato seco (aquoso): 20–35 mg/kg, 1 vez por dia. (12,15) Decocto: 500 mg para 150 mL de água.","TEMPO DE UTILIZAÇÃO":"Utilizar por, no máximo, oito semanas.(14)","SUPERDOSAGEM":"Em caso de administração acima das doses recomendadas, suspender o uso e manter o paciente em observação.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica."}},{"scientific":"Valeriana officinalis L.","name":"Valeriana","id":26,"page":107,"fields":{"Família":"Caprifoliaceae.(1)","Nomenclatura popular":"Valeriana.(2)","Parte utilizada/órgão vegetal":"Raízes.(2)","INDICAÇÕES TERAPÊUTICAS":"Usado como sedativo moderado, hipnótico e no tratamento de distúrbios do sono associados à ansiedade.(2)","CONTRAINDICAÇÕES":"Contraindicado para menores de 12 anos, grávidas, lactantes e pacientes com histórico de hipersensibilidade e alergia a qualquer um dos componentes do fitoterápico.(4,18)","PRECAUÇÕES DE USO":"Esse fitoterápico pode causar sonolência, não sendo, portanto, recomendável a sua administração antes de dirigir, operar máquinas ou realizar qualquer atividade de risco que necessite atenção.(4,5)","EFEITOS ADVERSOS":"Os efeitos adversos relatados pelos voluntários participantes dos ensaios clínicos e tratados com os diferentes extratos secos padronizados de V. officinalis foram raros, leves e similares àqueles apresentados pelos grupos tratados com o placebo.(6,7) Tais efeitos adversos incluem tontura, desconforto gastrointestinal, alergias de contato, cefaleia e midríase.(8-12) Com o uso em longo prazo, os seguintes sintomas podem ocorrer: cefaleia, cansaço, insônia, midríase e desordens cardíacas.(3) O uso de altas doses de V. officinalis por muitos anos aumentou a possibilidade de ocorrência de síndrome de abstinência com a retirada abrupta do fitoterápico.(5)","INTERAÇÕES MEDICAMENTOSAS":"Esse fitoterápico pode potencializar o efeito de outros depressores do SNC. Em estudos em animais verificou-se que V. officinalis possui efeito aditivo quando utilizada em combinação com barbitúricos, anestésicos ou benzodiazepínicos e outros fármacos depressores do SNC.(3,13) O extrato aquoso aumentou o tempo de sono com o tiopental (via oral em camundongo) e o extrato etanólico prolongou a anestesia promovida por tiopental (em camundongo) devido a sua afinidade aos receptores barbitúricos, e o extrato de V. officinalis e valepotriatos com receptores GABA e benzodiazepínicos (in vitro) e à diminuição dos efeitos causados pela retirada do diazepam por uma dose suficientemente grande de valepotriatos (em ratos), extratos de V. officinalis contendo valepotriatos, podendo auxiliar na síndrome de abstinência pela retirada do uso do diazepam.(14) Evitar o uso de V. officinalis com a ingestão de bebidas alcoólicas pela possível exacerbação dos efeitos sedativos.(15) Interações clínicas relevantes com drogas metabolizadas por CYP 2D6, CYP 3A4/5, CYP 1A2 ou CYP 2E1 não foram observadas.(18)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo a droga vegetal (raízes secas) ou extratos (hidroetanólico 40-70% (v/v); extratos aquosos) e tintura. Armazenar em frascos hermeticamente fechados, ao abrigo da luz e em local sob controle de temperatura.(2)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Pode ser utilizado para maiores de 12 anos, adultos e idosos. Se for prescrito o extrato hidroetanólico acima descrito: o equivalente a duas a três gramas. Droga vegetal: de 0,3 a 1 g da droga vegetal para usar o pó em cápsula. Como droga vegetal para preparação do decocto: 1 a 3 g. Extrato aquoso: 1 a 3 g. Tinturas (1:5, etanol 70%) 1 a 3 mL. Alcoolatura: de 2 a 5 mL.(19) Extrato seco: de 45 a 125 mg de dose diária.(19) Posologia - como sedativo leve: 1 a 3 vezes ao dia. Para distúrbios do sono: dose única antes de dormir mais uma dose no início da noite caso seja necessário. Dose máxima diária: 4 vezes ao dia.(2,18)","TEMPO DE UTILIZAÇÃO":"Para alcançar um efeito ótimo de tratamento, o uso continuado é recomendado durante 2-4 semanas, Valeriana officinalis L. não sendo indicado o tratamento agudo. Se os sintomas persistirem ou se agravar após 2 semanas de uso contínuo, o médico deve ser consultado.(18)","SUPERDOSAGEM":"Em casos de superdosagem (doses de raiz superiores a 20 g) podem ocorrer sintomas adversos leves como fadiga, câimbras abdominais, tensionamento do tórax, tontura, tremores e midríase que desapareceram no período de 24 horas após descontinuação do uso.(4) Altas doses de V. officinalis podem causar bradicardias, arritmias e redução do peristaltismo intestinal.(18)","PRESCRIÇÃO":"Fitoterápico, somente sob prescrição médica."}},{"scientific":"Zingiber officinale Roscoe","name":"Gengibre","id":27,"page":110,"fields":{"Família":"Zingiberaceae.(1)","Nomenclatura popular":"Gengibre.(2)","Parte utilizada/órgão vegetal":"Rizomas.(2)","INDICAÇÕES TERAPÊUTICAS":"Antiemético, antidispéptico, e nos casos de cinetose.(3)","CONTRAINDICAÇÕES":"Contraindicado para pessoas com cálculos biliares, irritação gástrica e hipertensão arterial. Não é indicado para crianças.(2)","PRECAUÇÕES DE USO":"Os pacientes que tomam medicamentos anticoagulantes ou que apresentam distúrbios da coagulação sanguínea devem consultar seu médico antes de se auto-medicar com gengibre. Pacientes com cálculos biliares devem consultar seu médico antes de usar preparações de gengibre.(4)","EFEITOS ADVERSOS":"Dermatite de contato tem sido relatada em pacientes sensíveis.(5)","INTERAÇÕES MEDICAMENTOSAS":"O gengibre pode afetar o tempo de sangramento e parâmetros imunológicos, devido a sua capacidade de inibir a tromboxano-sintetase e por atuar como agonista da prostaciclina.(6,7) No entanto, um estudo randomizado, duplo-cego sobre os efeitos de gengibre seco (2 g/dia, oralmente durante 14 dias) na função plaquetária não mostrou diferenças nos tempos de sangramento em pacientes que receberam gengibre ou placebo.(8,9)","FORMAS FARMACÊUTICAS":"Cápsulas ou comprimidos contendo extrato seco, droga vegetal (rizomas), extrato fluido, e tintura. (2,10) Gengibre em pó deve ser armazenado em recipientes hermeticamente fechados (não de plástico), ao abrigo da umidade e da luz, em local seco e fresco.(11,12)","VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)":"Oral. Infuso: acima de 12 anos: de 0,5 a 1 g em 150 mL de água, 5 minutos após o preparo, tomar de duas a quatro vezes ao dia.(2) Tintura: tomar 2,5 mL da tintura diluída em 75 mL de água, uma a três vezes ao dia ou 1,5 a 3,0 mL diariamente.(2,51) Em casos de cinetose em adultos e crianças com mais de 6 anos: 0,5 g, 2 a 4 vezes ao dia.(13,51) Dispepsia: 2 a 4 g da droga vegetal ou extrato seco.(3,14)","TEMPO DE UTILIZAÇÃO":"Pacientes que usaram gengibre por um período de 3 meses a 2,5 anos não apresentaram efeitos adversos.(15)","SUPERDOSAGEM":"Altas doses (12-14 g) de gengibre podem aumentar os efeitos hipotrombinêmicos da terapia anticoagulante.","PRESCRIÇÃO":"Fitoterápico, isento de prescrição médica.","PRINCIPAIS CLASSES QUÍMICAS":"Óleo essencial (zingibereno, β-bisabolol, β-sesquifelandreno), shogaol e gingerol; zingeronas e diterpenoides de núcleo labdano.(11,16–19)","INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS NÃO CLÍNICOS FARMACOLÓGICOS":"Estudos em animais relataram aumento da secreção biliar após administração intraduodenal de extrato acetônico do rizoma.(20) Em ratos, extrato acetônico e constituintes como shogaol e gingeróis estimularam a motilidade gastrointestinal por via oral; resultados variaram conforme a via de administração.(17,21–24) Estudos com animais sugeriram atividade antiemética periférica, relacionada a zingeronas e shogaóis.(25–27) Ensaios in vitro indicaram inibição de ciclo-oxigenase, lipoxigenase e tromboxano-sintetase; estudos em ratos observaram redução de edema. Esses resultados são pré-clínicos e não demonstram, isoladamente, eficácia terapêutica em humanos.(28–33)","INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS NÃO CLÍNICOS TOXICOLÓGICOS":"O Memento descreve resultados experimentais heterogêneos: atividade mutagênica de infuso e de alguns constituintes em determinados sistemas de teste, além de efeitos antimutagênicos observados para zingerona e sumo de gengibre em outros ensaios. Esses achados laboratoriais não equivalem, por si só, à demonstração de risco clínico em humanos.(34–38)","INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS CLÍNICOS FARMACOLÓGICOS":"O Memento relata estudos clínicos de prevenção e tratamento de náuseas e vômitos, incluindo cinetose, náuseas e vômitos pós-operatórios e hiperêmese gravídica. Um estudo com 940 mg de pó de rizoma comparou gengibre a 100 mg de dimenidrinato para sintomas gastrointestinais da cinetose.(39) Outros ensaios observaram redução de vômitos e sudorese em comparação com placebo e resultados comparáveis a antieméticos em determinados contextos.(40–44) Estudos sobre esvaziamento gástrico apresentaram resultados que não confirmaram alteração após doses orais de gengibre.(45,46) O Memento também descreve estudos com 250 mg quatro vezes ao dia em vômitos da gravidez e resultados em náuseas e vômitos pós-operatórios, além de relato de alívio variável de dor e edema em distúrbios reumáticos e musculoesqueléticos.(47–50) Os achados dependem da população, preparação e desenho de cada estudo; não ampliam automaticamente as indicações terapêuticas oficiais da ficha.","INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS CLÍNICOS TOXICOLÓGICOS":"O Memento relata ausência de efeitos teratogênicos observados nos recém-nascidos de estudos específicos em que gestantes utilizaram gengibre para hiperêmese gravídica; em um desses estudos, os recém-nascidos apresentaram APGAR de 9 ou 10 após cinco minutos.(27,47) Isso não estabelece segurança geral do uso durante a gestação.","OBSERVAÇÃO SOBRE FAIXA ETÁRIA":"A fonte apresenta uma divergência interna: em CONTRAINDICAÇÕES, informa que não é indicado para crianças; na POSOLOGIA, registra dose para cinetose em crianças com mais de 6 anos e infuso para maiores de 12 anos. As duas informações foram preservadas como publicadas, sem resolver a divergência por conta própria. Para uso pediátrico, é necessária avaliação profissional.","FONTE BIBLIOGRÁFICA":"BRASIL. Agência Nacional de Vigilância Sanitária (ANVISA). Memento Fitoterápico da Farmacopeia Brasileira. 1ª edição, 2016, p. 110–114. Os números entre parênteses remetem às referências bibliográficas da monografia original."}}];let page='home',selected=null,tab='Visão geral',query='';let fav;try{fav=new Set(JSON.parse(localStorage.getItem('phytotheca-favorites')||'[]'))}catch{fav=new Set()}const app=document.getElementById('app');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function navigate(p){page=p;query='';render();scrollTo(0,0)}function openPlant(id){selected=plants[id];tab='Visão geral';page='detail';render();scrollTo(0,0)}function toggleFav(id){fav.has(id)?fav.delete(id):fav.add(id);try{localStorage.setItem('phytotheca-favorites',JSON.stringify([...fav]))}catch{}render()}function nav(){return `<nav class="nav">${[['home','⌂','Início'],['plants','♧','Plantas'],['favorites','♡','Favoritos'],['more','☷','Mais']].map(([p,i,t])=>`<button class="${page===p?'active':''}" onclick="navigate('${p}')"><b>${i}</b>${t}</button>`).join('')}</nav>`}function home(){return `<div class="hero"><div class="eyebrow">Atlas clínico · Fitoterapia</div><div class="hero-center hero-cover"><img src="capa-horizontal-phytotheca.png" alt="PHYTOTHECA — Atlas de Plantas Medicinais, com composição botânica" loading="eager" onerror="this.style.display='none';this.nextElementSibling.style.display='block'"><div class="hero-cover-fallback" style="display:none"><h1>PHYTOTHECA</h1><div class="hero-sub">ATLAS DE PLANTAS MEDICINAIS</div></div></div><div class="hero-bottom"><input class="search" placeholder="Buscar planta, nome científico..." onfocus="navigate('plants')"><div class="hero-actions"><button onclick="navigate('plants')">Explorar atlas botânico ↗</button><button onclick="navigate('more')">Glossário e ferramentas ↗</button></div><div class="hero-note">28 monografias · Memento Fitoterápico</div></div></div>`}const plantPhotos={0:'Actaea racemosa L.jpg',1:'Aesculus_hippocastanum.jpeg',2:'Allium sativum L.jpeg',3:'Aloe vera (L.) Burm.f.jpeg',4:'Calendula_officinalis.jpg',5:'Cynara_scolymus.jpeg',6:'Echinacea_purpurea.jpg',7:'Equisetum_arvense.jpg',8:'Ginkgo_biloba.jpeg',9:'Glycine max (L.) Merr.jpg',10:'Harpagophytum_procumbens.jpg',11:'Hypericum perforatum L.jpg',12:'Lippia_sidoides.jpg',13:'Matricaria_chamomilla.jpg',14:'Maytenus_ilicifolia.jpg',15:'Passiflora_incarnata.jpeg',16:'Paullinia_cupana.jpg',17:'Peumus_boldus.jpeg',18:'Piper_methysticum.jpg',19:'Psidium_guajava.jpeg',20:'Rhamnus_purshiana.jpg',21:'Senna_alexandrina.jpg',22:'Serenoa_repens.jpg',23:'Stryphnodendron_adstringens.jpg',24:'Trifolium pratense L.jpeg',25:'Uncaria_tomentosa.jpg',26:'Valeriana.jpg',27:'Gengibre.jpeg'};function photoStyle(p){return plantPhotos[p.id]?` style="background-image:url('${encodeURI(plantPhotos[p.id])}')"`:''}function photoClass(p){return plantPhotos[p.id]?' has-photo':''}function rows(arr){return arr.length?arr.map(p=>`<button class="plant" onclick="openPlant(${p.id})"><span class="thumb${photoClass(p)}"${photoStyle(p)} aria-hidden="true">${plantPhotos[p.id]?'':'❧'}</span><span class="plant-name"><strong><i>${esc(p.scientific)}</i></strong><em>${esc(p.name)}</em></span><span class="arrow">›</span></button>`).join(''):'<p class="small">Nenhuma espécie encontrada.</p>'}function filtered(){return plants.filter(p=>(page!=='favorites'||fav.has(p.id))&&(`${p.name} ${p.scientific}`).toLocaleLowerCase('pt-BR').includes(query.toLocaleLowerCase('pt-BR'))).sort((a,b)=>a.scientific.localeCompare(b.scientific,'pt-BR'))}function listing(){return `<div class="top"><div class="eyebrow">Biblioteca científica</div><h2>${page==='favorites'?'Favoritos':'Plantas medicinais'}</h2><p class="small">28 monografias em ordem alfabética pelo nome científico, conforme o Memento Fitoterápico da Anvisa (2016).</p></div><div class="content"><input class="search" value="${esc(query)}" placeholder="Buscar por nome popular ou científico" oninput="query=this.value;updateList()"><p class="count">28 monografias · A–Z pelo nome científico</p><div id="list">${rows(filtered())}</div></div>`}function updateList(){document.getElementById('list').innerHTML=rows(filtered())}function section(title,txt,cls=''){return `<div class="section ${cls}"><h3>${title}</h3><p>${txt}</p></div>`}function detail(){const p=selected;const f=p.fields;const field=(key)=>f[key]||'Não foram identificadas informações específicas neste campo na extração do documento. Consulte a página indicada do Memento.';const tabs=p.id===0?['Visão geral','Indicações','Uso e dose','Segurança e contraindicações','Interações','Evidências','Referências']:['Visão geral','Indicações','Uso e dose','Segurança e contraindicações','Interações','Evidências','Referências'];let body=tab==='Visão geral'?`<div class="section"><div class="label">Identificação botânica</div><h3>${esc(p.name)}</h3><p><i>${esc(p.scientific)}</i></p></div>${section('Família',esc(field('Família')))}${section('Nomenclatura popular no Memento',esc(field('Nomenclatura popular')))}${section('Parte utilizada',esc(field('Parte utilizada/órgão vegetal')))}${f['Sinonímia']?section('Sinonímia',esc(f['Sinonímia'])):''}`:tab==='Indicações'?section('Indicações terapêuticas',esc(field('INDICAÇÕES TERAPÊUTICAS'))):tab==='Uso e dose'?section('Preparações e formas farmacêuticas',esc(field('FORMAS FARMACÊUTICAS')))+section('Posologia e via de administração',esc(field('VIAS DE ADMINISTRAÇÃO E POSOLOGIA (DOSE E INTERVALO)')))+section('Tempo de utilização',esc(field('TEMPO DE UTILIZAÇÃO')))+section('Prescrição',esc(field('PRESCRIÇÃO'))):tab==='Segurança e contraindicações'?section('Contraindicações',esc(field('CONTRAINDICAÇÕES')),'safety')+section('Precauções e advertências',esc(field('PRECAUÇÕES DE USO')),'safety')+section('Efeitos adversos',esc(field('EFEITOS ADVERSOS')),'safety')+section('Superdosagem',esc(field('SUPERDOSAGEM')),'safety'):section('Interações medicamentosas',esc(field('INTERAÇÕES MEDICAMENTOSAS')),'safety');if(p.id===0){const intro='';const first={
'Visão geral':section('Identificação botânica','Nome científico: Actaea racemosa L. | Família: Ranunculaceae | Sinônimo: Cimicifuga racemosa (L.) Nutt. | Nome popular: Cimicífuga | Parte utilizada: raiz ou rizoma.')+section('Principais classes químicas','Triterpenos (cimifugosídeo, 26-deoxiacteína, acteína e cimigenol), alcaloides, taninos e ácidos fenólicos.'),

'Segurança e contraindicações':section('Contraindicações','Hipersensibilidade aos componentes do fitoterápico; insuficiência hepática; gravidez.','safety')+section('Precauções','Suspender o uso se surgirem sinais sugestivos de insuficiência hepática: astenia, inapetência, icterícia, dor epigástrica intensa com náuseas e vômitos ou urina escura. Cautela em pessoas alérgicas à aspirina ou outros salicilatos. Quando associada à terapia de reposição hormonal, avaliação médica a cada seis meses.','safety')+section('Efeitos adversos','Desconforto gastrointestinal, erupção cutânea, cefaleia e tontura.','safety')+section('Superdosagem','Vertigem, cefaleia, náusea, vômito, hipotensão arterial, distúrbios visuais e circulatórios.','safety'),

'Evidências':section('Ensaios não clínicos','O Memento descreve investigações em células e animais, incluindo efeitos sobre proliferação celular, parâmetros hormonais e inflamação. Resultados experimentais não comprovam eficácia no tratamento de câncer em pessoas.')+section('Ensaios clínicos de eficácia','Estudo duplo-cego de 12 semanas descrito na monografia relatou melhora de sintomas do climatério com extrato de Actaea racemosa, superior ao placebo e semelhante aos estrogênios conjugados nas condições investigadas.')+section('Segurança hepática','Uma metanálise de cinco ensaios clínicos randomizados (N=1117) e um estudo prospectivo com 87 mulheres não relataram alterações hepáticas significativas nas condições estudadas. Esses achados não anulam as contraindicações e advertências hepáticas da monografia.'),
'Referências':section('Fonte primária','ANVISA. Memento Fitoterápico da Farmacopeia Brasileira. 1ª edição, 2016. Monografia Actaea racemosa L., páginas 18–20.')+section('Bibliografia','A página 20 da monografia contém 19 referências numeradas, incluindo monografias da OMS, EMA e estudos clínicos. Para consulta das referências completas, utilizar o Memento original.')};body=intro+(first[tab]||'');}if(p.id===27&&tab==='Evidências'){body=section('Principais classes químicas',esc(field('PRINCIPAIS CLASSES QUÍMICAS')))+section('Ensaios não clínicos farmacológicos',esc(field('INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS NÃO CLÍNICOS FARMACOLÓGICOS')))+section('Ensaios não clínicos toxicológicos',esc(field('INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS NÃO CLÍNICOS TOXICOLÓGICOS')))+section('Ensaios clínicos farmacológicos',esc(field('INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS CLÍNICOS FARMACOLÓGICOS')))+section('Ensaios clínicos toxicológicos',esc(field('INFORMAÇÕES SOBRE SEGURANÇA E EFICÁCIA — ENSAIOS CLÍNICOS TOXICOLÓGICOS')))+section('Observação sobre faixa etária',esc(field('OBSERVAÇÃO SOBRE FAIXA ETÁRIA')))}if(p.id!==0&&p.id!==27&&tab==='Evidências'){body=section('Evidências clínicas','Conteúdo científico em preparação.')}if(p.id===27&&tab==='Referências'){body=section('Fonte bibliográfica',esc(field('FONTE BIBLIOGRÁFICA')))}if(p.id!==0&&p.id!==27&&tab==='Referências'){body=section('Fonte primária',`ANVISA. Memento Fitoterápico da Farmacopeia Brasileira, 1ª edição (2016). Monografia de ${esc(p.scientific)}, página inicial ${p.page}. Consulte o documento oficial para as referências bibliográficas completas.`)}if(tab==='Evidências'){

}
return `<div class="detail-hero${photoClass(p)}"${photoStyle(p)}>${plantPhotos[p.id]?'':'❧'}</div><div class="detail"><button class="back" onclick="navigate('plants')">← Voltar às plantas</button><div class="detail-title"><h2>${esc(p.name)}</h2><button class="favorite" aria-label="Favoritar" onclick="toggleFav(${p.id})">${fav.has(p.id)?'♥':'♡'}</button></div><div class="latin">${esc(p.scientific)}</div><div class="tabs">${tabs.map((t,i)=>`<button class="${tab===t?'active':''}" onclick="tab='${t}';render()"><span class="tab-icon" aria-hidden="true">${['◈','✿','◷','⊘','⇄','▤','☷'][i]}</span>${t}</button>`).join('')}</div>${body}<div class="section"><div class="label">Fonte oficial</div><p>Memento Fitoterápico da Farmacopeia Brasileira, Anvisa, 1ª edição (2016), monografia iniciada na página ${p.page} (numeração impressa).</p></div></div>`}
function more(){const glossary=[['Infusão','Preparação em que se verte água aquecida sobre o material vegetal e se mantém contato pelo tempo indicado na referência.'],['Decocção','Preparação em que o material vegetal é aquecido com água durante um período determinado.'],['Maceração','Extração por contato do material vegetal com um líquido apropriado, sem fervura.'],['Tintura','Preparação extrativa líquida, frequentemente com solvente hidroalcoólico, sob condições definidas.']];return `<div class="top"><div class="eyebrow">Referência e apoio</div><h2>Glossário</h2><p class="small">Conceitos introdutórios de fitoterapia.</p></div><div class="content">${glossary.map(([a,b])=>section(a,b)).join('')}<div class="section"><h3>Fontes e limitações</h3><p>Fonte: Memento Fitoterápico da Farmacopeia Brasileira, 1ª edição (2016), Anvisa.</p><p><a href="https://www.gov.br/anvisa/pt-br/assuntos/farmacopeia" target="_blank" rel="noopener noreferrer">Portal oficial da Farmacopeia Brasileira (Anvisa) ↗</a></p></div><button class="action" onclick="navigate('calculator')">Abrir calculadora de proporção →</button></div>`}function calculator(){return `<div class="top"><div class="eyebrow">Ferramentas</div><h2>Calculadora</h2><p class="small">Conversão matemática, não uma recomendação de dose.</p></div><div class="content">${[['grams','Massa de referência (g)'],['reference','Volume de referência (mL)'],['volume','Volume desejado (mL)']].map(([id,t])=>`<div class="field"><label for="${id}">${t}</label><input id="${id}" type="number" min="0" step="any" placeholder="Digite um número positivo"></div>`).join('')}<button class="action" onclick="calc()">Calcular proporção</button><div class="result" id="answer"><span class="small">Preencha os três campos.</span></div><p class="small">Fórmula: massa proporcional = massa de referência × volume desejado ÷ volume de referência. Confira sempre a preparação e a dose em fonte oficial.</p></div>`}function calc(){const g=Number(document.getElementById('grams').value),r=Number(document.getElementById('reference').value),v=Number(document.getElementById('volume').value);document.getElementById('answer').innerHTML=g>0&&r>0&&v>0&&Number.isFinite(g*v/r)?`<span class="small">Resultado matemático</span><br><strong>${(g*v/r).toLocaleString('pt-BR',{maximumFractionDigits:3})} g</strong><p class="small">Não equivale a uma dose recomendada.</p>`:'<span class="small">Informe três valores positivos e válidos.</span>'}function render(){app.innerHTML=(page==='home'?home():page==='plants'||page==='favorites'?listing():page==='detail'?detail():page==='calculator'?calculator():more())+nav();document.querySelectorAll('.detail .section h3').forEach(h=>{if(/contraindica|advertência|precauç|reações adversas|toxicidade|segurança/i.test(h.textContent))h.setAttribute('data-risk','true')})}render();
</script></body></html>
